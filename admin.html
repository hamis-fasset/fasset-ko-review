<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fasset Korean review · Admin</title>
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#171a20;background:#f4f5f7}*{box-sizing:border-box}body{margin:0}header{background:#fff;border-bottom:1px solid #ddd;padding:16px 24px;display:flex;gap:12px;align-items:center}h1{font-size:18px;margin:0}main{max-width:1100px;margin:28px auto;padding:0 20px;display:grid;gap:20px}.card{background:#fff;border:1px solid #ddd;border-radius:12px;padding:18px;box-shadow:0 4px 18px #00000008}h2{font-size:15px;margin:0 0 14px}input,button{font:inherit;border:1px solid #c8cad0;border-radius:7px;padding:9px 11px}input{min-width:260px}button{background:#fff;cursor:pointer}button.primary{background:#5b52d6;color:#fff;border-color:#5b52d6}button:disabled{opacity:.5}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.status{font-size:13px;color:#69707d}.error{color:#b42318}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid #eee}th{color:#69707d;font-size:11px;text-transform:uppercase;letter-spacing:.05em}.badge{padding:2px 7px;border-radius:999px;background:#eef0f3}.done{background:#e8f7ee;color:#18794e}.linkbox{margin-top:12px;background:#f6f5ff;padding:12px;border-radius:8px;word-break:break-all;display:none}.sp{flex:1}@media(max-width:700px){table{display:block;overflow:auto}}
</style></head><body>
<header><h1>Fasset Korean review · Admin</h1><span class="sp"></span><a href="/" target="_blank">Open reviewer site</a></header>
<main>
  <section class="card" id="login"><h2>Admin access</h2><div class="row"><input id="secret" type="password" placeholder="Admin passcode" autocomplete="current-password"><button class="primary" id="load">Load dashboard</button><span class="status" id="login-status"></span></div></section>
  <section class="card" id="create" hidden><h2>Create a reviewer link</h2><div class="row"><input id="reviewer" placeholder="Reviewer name"><button class="primary" id="create-btn">Create secure link</button></div><div class="linkbox" id="linkbox"><strong id="link-label">Link ready</strong><div id="review-link" style="margin-top:6px"></div><button id="copy-link" style="margin-top:8px">Copy link</button></div></section>
  <section class="card" id="reviews" hidden><div class="row"><h2 style="margin:0">Review sessions</h2><span class="sp"></span><button id="refresh">Refresh</button></div><p class="status">Edits save automatically. “Submitted” means the reviewer explicitly pressed Submit review; autosaved work remains available before that.</p><div id="table"></div></section>
</main>
<script>
const $=s=>document.querySelector(s); let token=sessionStorage.getItem('ko-admin-token')||'';
async function api(path,options={}){const r=await fetch('/api/admin'+path,{...options,headers:{'authorization':'Bearer '+token,'content-type':'application/json',...(options.headers||{})}});const d=await r.json().catch(()=>({error:'Invalid server response.'}));if(!r.ok)throw new Error(d.error||'Request failed.');return d}
const fmt=x=>x?new Date(x).toLocaleString():'—';
async function load(){token=$('#secret').value||token;$('#login-status').textContent='Loading…';$('#login-status').className='status';try{const rows=await api('');sessionStorage.setItem('ko-admin-token',token);$('#login-status').textContent='Connected';$('#create').hidden=false;$('#reviews').hidden=false;render(rows)}catch(e){$('#login-status').textContent=e.message;$('#login-status').className='status error'}}
function render(rows){$('#table').innerHTML=rows.length?`<table><thead><tr><th>Reviewer</th><th>Status</th><th>Last saved</th><th>Edits</th><th>Approved</th><th>Screens</th><th>Actions</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.reviewerName)}</td><td><span class="badge ${r.submittedAt?'done':''}">${r.submittedAt?'Submitted':'In progress'}</span></td><td>${fmt(r.updatedAt)}</td><td>${r.edits}</td><td>${r.approved}</td><td>${r.screensDone}</td><td><div class="row"><button data-view="${r.id}">Create view link</button><button data-download="${r.id}">Download JSON</button></div></td></tr>`).join('')}</tbody></table>`:'<p class="status">No reviewer sessions yet.</p>'}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
$('#load').onclick=load;$('#secret').onkeydown=e=>{if(e.key==='Enter')load()};if(token){$('#secret').value=token;load()}
$('#refresh').onclick=async()=>render(await api(''));
function showLink(label,url){$('#link-label').textContent=label;$('#review-link').textContent=url;$('#linkbox').style.display='block';$('#copy-link').onclick=()=>navigator.clipboard.writeText(url);$('#linkbox').scrollIntoView({behavior:'smooth',block:'center'})}
$('#create-btn').onclick=async()=>{const reviewerName=$('#reviewer').value.trim();if(!reviewerName)return;const r=await api('',{method:'POST',body:JSON.stringify({reviewerName})});const url=`${location.origin}/?review=${r.id}#${r.token}`;showLink('Secure reviewer link',url);$('#reviewer').value='';render(await api(''))};
async function finalExport(r){
  const [app,fig,screens]=await Promise.all([fetch('/data/copy.json').then(x=>x.json()),fetch('/data/figma/copy.json').then(x=>x.json()),fetch('/data/figma/screens.json').then(x=>x.json())]);
  app.forEach(x=>x.v='app');fig.forEach(x=>x.v='fig');const rows=app.concat(fig),byKey=Object.fromEntries(rows.map(x=>[x.k,x]));const s=r.state||{},edits=s.edits||{},approved=s.approved||{};const ko=k=>edits[k]??byKey[k]?.ko;
  const changed=Object.entries(edits).map(([k,v])=>({key:k,english:byKey[k]?.en,original_korean:byKey[k]?.ko,new_korean:v,approved:!!approved[k],also_used_as:byKey[k]?.dupes||[]}));
  return {exported:new Date().toISOString(),app:'Fasset CashApp',locale:'ko',reviewer:r.reviewerName,review_id:r.id,submitted_at:r.submittedAt||null,edits:changed.filter(x=>!byKey[x.key]?.hc&&byKey[x.key]?.v!=='fig'),hardcoded:rows.filter(x=>x.hc).map(x=>({id:x.k,english:x.en,korean:ko(x.k),approved:!!approved[x.k],edited:edits[x.k]!=null,screens:x.screens||[]})),new_design:rows.filter(x=>x.v==='fig').map(x=>({id:x.k,english:x.en,template:x.template||null,original_korean:x.ko,new_korean:ko(x.k),edited:edits[x.k]!=null,approved:!!approved[x.k],component:x.c,figma:x.figma||[]})),figma_file:screens.file||null,approved_unchanged:Object.keys(approved).filter(k=>edits[k]==null),screens_done:Object.keys(s.done||{}),counts:{edits:changed.length,approved:Object.keys(approved).length,screens_done:Object.keys(s.done||{}).length}};
}
$('#table').onclick=async e=>{
  const view=e.target.closest('[data-view]');if(view){view.disabled=true;try{const r=await api('',{method:'POST',body:JSON.stringify({action:'createView',id:view.dataset.view})});showLink('Public read-only view link',`${location.origin}/?view=${r.id}#${r.viewToken}`);render(await api(''))}finally{view.disabled=false}return}
  const b=e.target.closest('[data-download]');if(!b)return;b.disabled=true;try{const r=await api('?id='+encodeURIComponent(b.dataset.download));const out=await finalExport(r);const blob=new Blob([JSON.stringify(out,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`fasset-korean-review-${r.reviewerName.replace(/[^a-z0-9]+/gi,'-').toLowerCase()}.json`;a.click()}finally{b.disabled=false}
};
</script></body></html>
